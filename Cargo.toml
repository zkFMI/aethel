[workspace]
resolver = "2"
members = ["crates/aethel-types", "crates/aethel-provider-sdk", "crates/aethel-core", "crates/aethel-tokenization", "crates/aethel-distribution", "crates/aethel-obligation-wallet", "crates/aethel-servicing", "crates/aethel-deccp", "crates/aethel-dekyx", "crates/aethel-zkpi", "crates/aethel-defmi-host", "crates/aethel"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
zkfmi-crypto = { git = "https://github.com/zkFMI/zkfmi-crypto.git", rev = "9a183c90b6ee6af17fce26ca4b235bdb543dc0a0" }
deccp-core = { git = "https://github.com/zkFMI/deccp.git", rev = "7cb59ccc228f739bd7c532f4ab2419ca4e2e0eee" }
dekyx-core = { git = "https://github.com/zkFMI/dekyx.git", rev = "09c2c1a7295e8cab592aca6af2f89381c3c110ac" }
defmi-avalanche-vm = { git = "https://github.com/zkFMI/defmi.git", rev = "b48bda6cf07abb74068b85268c9293ef37b1e68e" }
zkpi-defmi-sdk = { git = "https://github.com/zkFMI/defmi.git", rev = "b48bda6cf07abb74068b85268c9293ef37b1e68e" }
defmi = { git = "https://github.com/zkFMI/defmi.git", rev = "b48bda6cf07abb74068b85268c9293ef37b1e68e" }
zkpi = { git = "https://github.com/zkFMI/zkpi.git", rev = "38baa1a86bedd2b47d7439c57412d25a20f9c405" }
zkfmi-zk = { git = "https://github.com/zkFMI/zkpi.git", rev = "38baa1a86bedd2b47d7439c57412d25a20f9c405" }
qomm-proofs = { git = "https://github.com/zkFMI/zkpi.git", rev = "38baa1a86bedd2b47d7439c57412d25a20f9c405" }
zkfmi-measure = { git = "https://github.com/zkFMI/zkpi.git", rev = "38baa1a86bedd2b47d7439c57412d25a20f9c405" }
qomm-audit = { git = "https://github.com/zkFMI/zkpi.git", rev = "38baa1a86bedd2b47d7439c57412d25a20f9c405" }
qomm-transport = { git = "https://github.com/zkFMI/zkpi.git", rev = "38baa1a86bedd2b47d7439c57412d25a20f9c405" }
qomm-mpc = { git = "https://github.com/zkFMI/zkpi.git", rev = "38baa1a86bedd2b47d7439c57412d25a20f9c405" }
qomm-sim = { git = "https://github.com/zkFMI/zkpi.git", rev = "38baa1a86bedd2b47d7439c57412d25a20f9c405" }
qomm-law = { git = "https://github.com/zkFMI/qomm.git", rev = "de39fdece2214d204e4efa8b562f907566183b48" }
qomm-dsl = { git = "https://github.com/zkFMI/zkpi.git", rev = "38baa1a86bedd2b47d7439c57412d25a20f9c405" }
# Audited by Quarkslab (2019, commissioned by Tari Labs, 30 man-days) together
# with subtle and bulletproofs. 4.1.3 is the first release carrying the fix for
# RUSTSEC-2024-0344, a timing leak LLVM introduced into Scalar::sub, so the
# floor is not negotiable.
curve25519-dalek = { version = "4.1.3", features = ["rand_core", "digest"] }
bulletproofs = "5.0"
merlin = "3"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
subtle = "2.5"
# Threshold Schnorr from the Zcash Foundation, partially audited by NCC Group
# (2023, v0.6.0). Replaces a hand-rolled threshold sigma protocol.
frost-ristretto255 = "3.0"
frost-core = "3.0"
# Ed25519 signatures for the KYB issuer. Same dalek assessment as the group.
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
base64 = "0.22"
hex = "0.4"
thiserror = "1"
rand = "0.8"
regex = "1.13.1"
openssl = { version = "=0.10.81", features = ["vendored"] }
libc = "0.2"
aethel-types = { path = "crates/aethel-types" }
aethel-provider-sdk = { path = "crates/aethel-provider-sdk" }
aethel-core = { path = "crates/aethel-core" }
aethel-tokenization = { path = "crates/aethel-tokenization" }
aethel-distribution = { path = "crates/aethel-distribution" }
aethel-obligation-wallet = { path = "crates/aethel-obligation-wallet" }
aethel-servicing = { path = "crates/aethel-servicing" }
aethel = { path = "crates/aethel" }
