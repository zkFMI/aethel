[package]
name = "aethel-defmi-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Aethel-owned application runtime for the generic DeFMI consensus host"

[dependencies]
aethel-core.workspace = true
aethel-deccp = { path = "../aethel-deccp" }
aethel-zkpi = { path = "../aethel-zkpi" }
deccp-core.workspace = true
defmi-avalanche-vm.workspace = true
defmi.workspace = true
zkfmi-zk.workspace = true
base64.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
aethel-provider-sdk = { workspace = true, features = ["test-support"] }
zkfmi-crypto = { workspace = true, features = ["test-support"] }
curve25519-dalek.workspace = true
ed25519-dalek.workspace = true
zkpi-proofs.workspace = true
rand_core.workspace = true
