[package]
name = "aethel-defmi-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Aethel-owned application runtime for the generic DeFMI consensus host"

[dependencies]
aethel-core.workspace = true
aethel-deccp = { path = "../aethel-deccp" }
aethel-zkpi = { path = "../aethel-zkpi" }
deccp-core = { git = "https://github.com/zkFMI/deccp", rev = "3660ebab170723d055be3cf26ea8e2f039d6514b" }
qomm-avalanche-vm = { path = "../../../defmi/rust/qomm-avalanche-vm" }
qomm-defmi = { path = "../../../defmi/rust/qomm-defmi" }
qomm-zk = { path = "../../../defmi/rust/qomm-zk" }
base64.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
curve25519-dalek.workspace = true
ed25519-dalek.workspace = true
qomm-proofs = { path = "../../../defmi/rust/qomm-proofs" }
rand_core.workspace = true
