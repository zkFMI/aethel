[package]
name = "aethel-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Streaming-receivable protocol state for Aethel on DeFMI"

[dependencies]
# DeKYX is the independent identity and qualification layer. These are sibling
# workspaces under mvp/; a remote test run must transfer mvp/dekyx next to
# mvp/qomm (see the Makefile remote-test target).
dekyx-core = { git = "https://github.com/shukob/dekyx" }
dekyx-aethel = { git = "https://github.com/shukob/dekyx" }
ed25519-dalek.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true

[dev-dependencies]
rand_core.workspace = true
