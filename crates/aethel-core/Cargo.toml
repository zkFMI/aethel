[package]
name = "aethel-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Streaming-receivable protocol state for Aethel on DeFMI"

[dependencies]
aethel-types.workspace = true
aethel-provider-sdk.workspace = true
# DeKYX is the independent identity and qualification layer. These are sibling
# workspaces under mvp/; a remote test run must transfer mvp/dekyx next to
# mvp/qomm (see the Makefile remote-test target).
dekyx-core = { git = "https://github.com/zkFMI/dekyx.git", rev = "67eb59a1548740d15585a42d9cff8bc06ae95c5e" }
dekyx-aethel = { package = "aethel-dekyx", path = "../aethel-dekyx" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
ed25519-dalek.workspace = true
hex.workspace = true
rand_core.workspace = true
